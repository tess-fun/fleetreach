[package]
name = "fleetreach-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Fleet-wide dependency security audit across 12 ecosystems from one CLI: deduplicated and ranked, with blast-radius analysis, a batched remediation queue, and sound Rust reachability."

[lints]
workspace = true

[features]
# Opt-in network access: advisory-DB fetch (via scan) + KEV/EPSS/NVD enrichment
# (via ureq). Off by default so the build is pure-Rust (no rustls/aws-lc/ring);
# without it, use --db for the advisory DB and --kev-file/--epss-file to enrich. M-5.
network = ["dep:ureq", "fleetreach-scan/network"]

[lib]
name = "fleetreach_cli"
path = "src/lib.rs"

[[bin]]
name = "fleetreach"
path = "src/main.rs"

[dependencies]
comfy-table = { workspace = true }
roxmltree = { workspace = true }
spdx = { workspace = true }
fleetreach-core = { path = "../core", version = "1.6.0" }
fleetreach-scan = { path = "../scan", version = "1.6.0" }
fleetreach-reach = { path = "../reach", version = "1.6.0" }
fleetreach-correlate = { path = "../correlate", version = "1.6.0" }
fleetreach-report = { path = "../report", version = "1.6.0" }
fleetreach-go = { path = "../go", version = "1.6.0" }
fleetreach-npm = { path = "../npm", version = "1.6.0" }
fleetreach-pypi = { path = "../pypi", version = "1.6.0" }
fleetreach-rubygems = { path = "../rubygems", version = "1.6.0" }
fleetreach-packagist = { path = "../packagist", version = "1.6.0" }
fleetreach-nuget = { path = "../nuget", version = "1.6.0" }
fleetreach-julia = { path = "../julia", version = "1.6.0" }
fleetreach-swift = { path = "../swift", version = "1.6.0" }
fleetreach-hex = { path = "../hex", version = "1.6.0" }
fleetreach-ghactions = { path = "../ghactions", version = "1.6.0" }
fleetreach-maven = { path = "../maven", version = "1.6.0" }
fleetreach-os = { path = "../os", version = "1.6.0" }
serde = { workspace = true }
sha2 = { workspace = true }
# Docker config logins and HTTP Basic (pure Rust).
base64 = "0.22"
# Checks cosign signatures on VEX attached to images (RustCrypto, pure Rust).
p256 = { version = "0.14", default-features = false, features = ["ecdsa", "pem", "pkcs8"] }
toml = { workspace = true }
# Raises a requirement in a Cargo.toml without touching its layout or comments (pure Rust).
toml_edit = "0.25"
walkdir = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
clap = { workspace = true }
time = { workspace = true }
serde_json = { workspace = true }
# blocking HTTP for the KEV/EPSS feeds + advisory-DB fetch (the `network` feature);
# pulls rustls (vendored-C crypto), so it is optional and off by default. M-5.
ureq = { version = "3", optional = true }
rayon = "1"
tempfile = "3"
# Validate a freshly downloaded osv.dev export before installing it (spec 01). Same pure-Rust
# inflate backend as the core loader.
zip = { version = "9", default-features = false, features = ["deflate-flate2-zlib-rs"] }
# Gzip for scan history snapshots (spec 09): the same pure-Rust zlib-rs backend, no C.
flate2 = { version = "1", default-features = false, features = ["zlib-rs"] }
# Red Hat's CSAF VEX archive is a `.tar.zst` (spec 16, row 12): pure-Rust zstd decoder and
# tar reader (no xattr support needed, so no default features).
ruzstd = "0.9"
# SUSE's CSAF VEX archive is a `.tar.bz2` (decode-only, MIT/Apache; see fleetreach-os).
bzip2-rs = "0.1"
tar = { version = "0.4", default-features = false }

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
proptest = "1"
