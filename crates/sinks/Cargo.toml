[package]
name = "fleetreach-sinks"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Vulnerable-function (sink) data for fleetreach from artifact diffs: method-level diffs of the last affected and first fixed release."
