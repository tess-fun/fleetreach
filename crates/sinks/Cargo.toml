[package]
name = "fleetreach-sinks"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords.workspace = true
categories.workspace = true
description = "Vulnerable-function (sink) data for fleetreach: curated sink records, a proposer that reads fix commits, and method-level jar diffs."

[lints]
workspace = true

[dependencies]
cafebabe = "0.9"
oxc_allocator = "0.158.0"
oxc_ast = "0.158.0"
oxc_ast_visit = "0.158.0"
oxc_parser = "0.158.0"
oxc_span = "0.158.0"
oxc_syntax = "0.158.0"
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
zip = { version = "9", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[dev-dependencies]
tempfile = "3"
