[package]
name = "fleetreach-sinks"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Vulnerable-function (sink) data for fleetreach: curated sink records, a proposer that reads fix commits, and method-level jar diffs."
# Not published yet: the curated sink records are consumed by JVM reachability (1.7.0).
publish = false

[lints]
workspace = true

[dependencies]
cafebabe = "0.9"
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
zip = { version = "9", default-features = false, features = ["deflate-flate2-zlib-rs"] }
