[package]
name = "fleetreach-jvm"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
description = "JVM call graphs for fleetreach: reads class files and jars as data and answers which sink methods are reached."
# Not published yet: wired into `scan --reachability` once E3 has measured it.
publish = false

[lints]
workspace = true

[dependencies]
cafebabe = "0.9"
fleetreach-sinks = { path = "../sinks" }
thiserror = { workspace = true }
zip = { version = "9", default-features = false, features = ["deflate-flate2-zlib-rs"] }
