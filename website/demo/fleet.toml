# The demo fleet behind every example on the website and in the README.
# Eight small repos for a made-up company, Acme, across five ecosystems.
# The advisory data is frozen in ./data, so the output only changes when fleetreach does.
# Regenerate the examples with: node website/scripts/examples.mjs

[settings.osv]
dir = "data/osv"

[settings.context.defaults]
exposure       = "controlled"
mission_impact = "degraded"
safety_impact  = "negligible"

[[repo]]
id             = "payments-api"
path           = "repos/payments-api"
owner          = "team-payments"
exposure       = "open"
mission_impact = "mission-failure"
tags           = ["pci", "tier-1"]

[[repo]]
id             = "ledger-svc"
path           = "repos/ledger-svc"
owner          = "team-payments"
mission_impact = "mef-failure"
tags           = ["pci"]

[[repo]]
id       = "checkout-web"
path     = "repos/checkout-web"
owner    = "team-storefront"
exposure = "open"
mission_impact = "mef-failure"

[[repo]]
id    = "admin-dashboard"
path  = "repos/admin-dashboard"
owner = "team-storefront"

[[repo]]
id    = "ml-service"
path  = "repos/ml-service"
owner = "team-data"

[[repo]]
id    = "data-pipeline"
path  = "repos/data-pipeline"
owner = "team-data"
exposure = "small"

[[repo]]
id    = "inventory-svc"
path  = "repos/inventory-svc"
owner = "team-platform"

[[repo]]
id    = "billing"
path  = "repos/billing"
owner = "team-payments"

[[repo]]
id             = "partner-api"
path           = "repos/partner-api"
owner          = "team-platform"
exposure       = "open"
mission_impact = "mission-failure"
