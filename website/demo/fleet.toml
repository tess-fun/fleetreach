# The demo fleet behind every example on the website and in the README.
# Nine small repos for a made-up company, Acme, in six languages. before/ holds billing as it
# was at the first recorded run, for the history examples (scripts/examples.mjs).
# The advisory data is frozen in ./data, so the output only changes when fleetreach does.
# Regenerate the examples with: node website/scripts/examples.mjs

[settings.osv]
dir = "data/osv"

[settings.sla]
immediate      = "2d"
"out-of-cycle" = "14d"
scheduled      = "60d"
critical       = "14d"
high           = "30d"
medium         = "90d"

[[settings.vex_assertion]]
id            = "RUSTSEC-2020-0071"
repo          = "ledger-svc"
justification = "vulnerable_code_not_in_execute_path"
reason        = "ledger-svc never formats local time; it only uses UTC timestamps"
approved_by   = "security@acme.example"

[settings.context.defaults]
exposure       = "controlled"
mission_impact = "degraded"
safety_impact  = "negligible"

[[repo]]
id             = "payments-api"
path           = "repos/payments-api"
owner          = "team-payments"
exposure       = "open"
mission_impact = "mission-failure"
tags           = ["pci", "tier-1"]

[[repo]]
id             = "ledger-svc"
path           = "repos/ledger-svc"
owner          = "team-payments"
mission_impact = "mef-failure"
tags           = ["pci"]

[[repo]]
id       = "checkout-web"
path     = "repos/checkout-web"
owner    = "team-storefront"
exposure = "open"
mission_impact = "mef-failure"

[[repo]]
id    = "admin-dashboard"
path  = "repos/admin-dashboard"
owner = "team-storefront"

[[repo]]
id    = "ml-service"
path  = "repos/ml-service"
owner = "team-data"

[[repo]]
id    = "data-pipeline"
path  = "repos/data-pipeline"
owner = "team-data"
exposure = "small"

[[repo]]
id    = "inventory-svc"
path  = "repos/inventory-svc"
owner = "team-platform"

[[repo]]
id    = "billing"
path  = "repos/billing"
owner = "team-payments"

[[repo]]
id             = "partner-api"
path           = "repos/partner-api"
owner          = "team-platform"
exposure       = "open"
mission_impact = "mission-failure"
