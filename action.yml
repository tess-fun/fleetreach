name: "fleetreach"
description: "Fleet-wide dependency advisory audit across 12 ecosystems; uploads findings to GitHub code scanning (SARIF)."
branding:
  icon: "shield"
  color: "orange"

inputs:
  args:
    description: "Extra arguments passed to `fleetreach scan` (e.g. '--enrich --resolve-features')."
    required: false
    default: ""
  config:
    description: "Path to fleet.toml (defaults to scanning this repo via a generated one)."
    required: false
    default: ""
  sarif-file:
    description: "Where to write the SARIF report."
    required: false
    default: "fleetreach.sarif"
  upload:
    description: "Upload the SARIF to GitHub code scanning."
    required: false
    default: "true"
  version:
    description: "fleetreach version to install (e.g. '1.2.0'), or 'latest'. A prebuilt release binary is used when one exists for the runner; otherwise it is built with cargo."
    required: false
    default: "latest"

runs:
  using: "composite"
  steps:
    - name: Install fleetreach
      shell: bash
      env:
        FLEETREACH_VERSION: ${{ inputs.version }}
        FLEETREACH_INSTALL_DIR: ${{ runner.temp }}/fleetreach-bin
      # Prefer the prebuilt, checksum-verified release binary (seconds). Fall back to building
      # with cargo (minutes) on runners without one, such as Windows, or before the first
      # release with binaries. Both carry the `network` feature (OSV sync, enrichment).
      run: |
        if [ "$RUNNER_OS" != "Windows" ] && sh "${{ github.action_path }}/scripts/install.sh"; then
          echo "$FLEETREACH_INSTALL_DIR" >> "$GITHUB_PATH"
        else
          echo "no prebuilt binary for this runner; building with cargo"
          if [ "$FLEETREACH_VERSION" = "latest" ]; then
            cargo install --locked --features network fleetreach-cli
          else
            cargo install --locked --features network fleetreach-cli --version "$FLEETREACH_VERSION"
          fi
        fi

    - name: Generate a default fleet.toml (scan this repo) if none provided
      if: ${{ inputs.config == '' }}
      shell: bash
      run: printf '[[repo]]\nid = "%s"\npath = "."\n' "${GITHUB_REPOSITORY##*/}" > fleetreach-ci.toml

    - name: Scan
      shell: bash
      # Don't abort on a non-zero gate exit — we still want to publish the SARIF.
      run: |
        cfg="${{ inputs.config }}"; [ -z "$cfg" ] && cfg="fleetreach-ci.toml"
        fleetreach scan -c "$cfg" -f sarif ${{ inputs.args }} > "${{ inputs.sarif-file }}" || true

    - name: Upload SARIF to code scanning
      if: ${{ inputs.upload == 'true' }}
      uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: ${{ inputs.sarif-file }}
