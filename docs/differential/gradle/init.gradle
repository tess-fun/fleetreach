// Prints every external module Gradle resolves on each project's four JVM classpaths:
//   FA <project path> <configuration> <group>:<module>:<version>
// and each dependency that does not resolve:
//   FAUNRESOLVED <project path> <configuration> <requested>
// Resolution is lenient: one unresolvable module never stops the listing.
allprojects { p ->
    p.tasks.register('faDeps') {
        notCompatibleWithConfigurationCache('reads configurations at execution time')
        doLast {
            ['compileClasspath', 'runtimeClasspath', 'testCompileClasspath', 'testRuntimeClasspath'].each { n ->
                def c = p.configurations.findByName(n)
                if (c == null || !c.canBeResolved) {
                    return
                }
                def result = c.incoming.resolutionResult
                result.allComponents.each { comp ->
                    def id = comp.id
                    if (id instanceof org.gradle.api.artifacts.component.ModuleComponentIdentifier) {
                        println "FA ${p.path} ${n} ${id.group}:${id.module}:${id.version}"
                    }
                }
                result.allDependencies.each { d ->
                    if (d instanceof org.gradle.api.artifacts.result.UnresolvedDependencyResult) {
                        println "FAUNRESOLVED ${p.path} ${n} ${d.requested.displayName}"
                    }
                }
            }
        }
    }
}
